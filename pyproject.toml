[project]
name = "media-renamer"
version = "0.2.0"
description = "Batch rename media files with sequential numbering by type and creation time. CLI + Python library."
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "faraday208" }]
keywords = ["media", "rename", "batch", "dataset", "pipeline"]

# Sıfır zorunlu bağımlılık — sadece Python stdlib.
# Pillow opsiyonel (EXIF DateTimeOriginal okuma için).
dependencies = []

[project.optional-dependencies]
exif = ["pillow>=10.0"]

[tool.uv]
package = false
