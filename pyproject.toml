[project]
name = "media-organizer"
version = "0.6.0"
description = "Organize media files for dataset prep: batch rename + relocate (copy/move to output dir) + undo, with sequential numbering by type and creation time."
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "faraday208" }]
keywords = ["media", "organize", "rename", "batch", "dataset", "pipeline"]

# Sıfır zorunlu bağımlılık — sadece Python stdlib.
# Pillow opsiyonel (EXIF DateTimeOriginal okuma için).
dependencies = []

[project.optional-dependencies]
exif = ["pillow>=10.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pillow>=10.0",  # EXIF testleri için gerekli
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
