[project]
name = "media-organizer"
version = "0.1.0"
description = "CLI tool to batch rename media files with sequential numbering by type and creation time"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "faraday208" }]
keywords = ["media", "rename", "batch", "organize", "dataset", "pipeline"]

# Sıfır dependency — sadece Python stdlib
dependencies = []

[project.scripts]
media-organizer = "rename_files:main"

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
