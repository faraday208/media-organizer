[project]
name = "media-organizer"
version = "0.1.0"
description = "CLI tool to batch rename media files with sequential numbering by type and creation time"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "faraday208" }]
keywords = ["media", "rename", "batch", "organize", "dataset", "pipeline"]

# Sıfır zorunlu bağımlılık — sadece Python stdlib.
# Pillow opsiyonel (EXIF DateTimeOriginal okuma için).
dependencies = []

[project.optional-dependencies]
exif = ["pillow>=10.0"]

[tool.uv]
package = false
